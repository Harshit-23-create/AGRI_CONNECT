<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AgriConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/government-scheme.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/languageBar :: language-bar-fragment}"></div>

<!-- Wrapping fragments with th:block for clean Thymeleaf syntax -->
<th:block th:replace="~{fragments/mainNav :: main-nav-fragment}"></th:block>

<th:block th:replace="~{fragmentGovScheme/govscheme :: government-scheme}"></th:block>

<th:block th:replace="~{fragmentGovScheme/scheme :: scheme}"></th:block>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<th:block th:replace="~{fragments/chatbot :: chatbot-fragment}"></th:block>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Filter functionality
        const applyFilterBtn = document.querySelector('.btn-agri-primary');
        const resetFilterBtn = document.querySelector('.btn-agri-outline');

        if (applyFilterBtn) {
            applyFilterBtn.addEventListener('click', () => {
                console.log('Filters applied!');
            });
        }

        if (resetFilterBtn) {
            resetFilterBtn.addEventListener('click', () => {
                document.getElementById('scheme-type').value = '';
                document.getElementById('state').value = '';
                document.getElementById('category').value = '';
                console.log('Filters reset!');
            });
        }
    });
</script>

</body>
</html>
