<!-- loginPage.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriConnect Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* AgriConnect background gradient */
            background: #2D5016;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            animation: floatIn 1s ease-in-out;
        }
        @keyframes floatIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .btn-agri {
            background-color: #2e7d32;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-agri:hover {
            background-color: #256427;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div th:fragment="login-form"
     class="card login-card p-4 animate__animated animate__fadeInDown"
     th:object="${loginRequest}">

    <!-- Title -->
    <div class="text-center mb-4">
        <i class="bi bi-person-circle fs-1 text-success"></i>
        <h3 class="fw-bold mt-2" style="color: #2e7d32;">AgriConnect Login</h3>
        <p class="text-muted">Welcome back! Please login to continue</p>
    </div>

    <form th:action="@{/doLogin}" th:method="post" class="needs-validation" novalidate>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label fw-semibold" for="email">
                <i class="bi bi-envelope-fill me-2 text-success"></i>Email
            </label>
            <input type="email" th:field="*{email}"
                   class="form-control shadow-sm" id="email"
                   placeholder="Enter your email" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label fw-semibold" for="password">
                <i class="bi bi-lock-fill me-2 text-success"></i>Password
            </label>
            <input type="password" th:field="*{password}"
                   class="form-control shadow-sm" id="password"
                   placeholder="Enter your password" required>
        </div>
        <!-- Buttons -->
        <div class="d-flex gap-2">
            <!-- Register -->
            <button type="submit" class="btn btn-agri w-100 shadow-sm">
                <i class="bi bi-person-check-fill me-2"></i> Login
            </button>

            <!-- Back -->
            <a th:href="@{/farmerTemplate}" class="btn btn-back w-100 shadow-sm">
                <i class="bi bi-arrow-left-circle me-2"></i> Back
            </a>
        </div>
        <!-- Register -->
        <p class="mt-3 text-center">
            Don’t have an account?
            <a th:href="@{/registerPage}" class="fw-semibold" style="color: #f57c00;">Register here</a>
        </p>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
