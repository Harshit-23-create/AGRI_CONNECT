<!-- fragments/languageBar.html -->
<div th:fragment="language-bar-fragment"
     class="language-bar py-2 shadow-sm animate__animated animate__fadeInDown"
     style="background-color: #1B2D12;">

    <div class="container d-flex justify-content-between align-items-center">

        <!-- Logo / Branding -->
        <div class="d-flex align-items-center">
            <i class="fas fa-leaf me-2" style="color: #fbc02d; font-size: 1.4rem;"></i>
            <span class="fw-bold fs-5 text-white">AgriConnect</span>
        </div>

        <!-- Language Options -->
        <div class="d-flex align-items-center">
            <div th:classappend="${userLanguage == 'en'} ? 'active' : ''"
                 class="language-option px-3 py-1 me-2 rounded" data-lang="en">
                <i  class="fas fa-language me-1"></i> English
            </div>
            <div th:classappend="${userLanguage == 'hi'} ? 'active' : ''"
                 class="language-option px-3 py-1 me-2 rounded" data-lang="hi">
                <i class="fas fa-language me-1"></i> Hindi
            </div>
            <div th:classappend="${userLanguage == 'ta'} ? 'active' : ''"
                 class="language-option px-3 py-1 me-2 rounded" data-lang="ta">
                <i class="fas fa-language me-1"></i> Tamil
            </div>
            <div th:classappend="${userLanguage == 'te'} ? 'active' : ''"
                 class="language-option px-3 py-1 rounded" data-lang="te">
                <i class="fas fa-language me-1"></i> Telugu
            </div>
        </div>

        <!-- Auth / Profile Section -->
        <div class="d-flex align-items-center">
            <!-- If user is logged in -->
            <div th:if="${session.loggedInUser != null}" class="d-flex align-items-center">
                <a th:href="@{/profile}" class="d-flex align-items-center text-decoration-none">
                    <i class="fas fa-user-circle me-2 text-white" style="font-size:1.4rem;"></i>
                    <span class="text-white fw-semibold" th:text="${session.loggedInUser.username}">Username</span>
                </a>
                <a th:href="@{/logout}" class="btn btn-danger btn-sm ms-3 shadow-sm fw-semibold">
                    Logout
                </a>
            </div>

            <!-- If user is NOT logged in -->
            <div th:if="${session.loggedInUser == null}">
                <a th:href="@{/loginPage}"
                   class="btn btn-warning btn-sm me-2 shadow-sm fw-semibold login-btn">
                    Login
                </a>
                <a th:href="@{/registerPage}"
                   class="btn btn-warning btn-sm shadow-sm fw-semibold register-btn">
                    Register
                </a>
            </div>
        </div>

    </div>
</div>

<!-- External Libraries -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

<style>
    .language-option {
        cursor: pointer;
        transition: all 0.3s ease;
        color: #ffffff;
        user-select: none;
    }

    .language-option:hover {
        background-color: #2D5016;
        color: #fbc02d !important;
        transform: translateY(-2px);
        box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.15);
    }

    .language-option.active {
        background-color: #2D5016;
        color: #fbc02d !important;
        font-weight: bold;
    }

    .btn-warning {
        border-radius: 8px;
        transition: all 0.3s ease;
        background-color: #fbc02d;
        color: #1B2D12;
        border: none;
    }

    .btn-warning:hover {
        background-color: #f57c00 !important;
        transform: scale(1.05);
        color: #fff !important;
    }
</style>
