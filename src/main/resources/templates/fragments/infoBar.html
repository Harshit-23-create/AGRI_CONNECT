<!-- fragments/infoBar.html -->
<div th:fragment="info-bar-fragment" xmlns:th="http://www.w3.org/1999/xhtml">
    <div class="info-bar py-3  text-white" style="background-color: #2D5016;">
        <div class="container d-flex flex-wrap justify-content-between align-items-center" style="border:1px solid #1b2d12;">

            <!-- Temperature -->
            <div class="info-item d-flex align-items-center mb-2 mb-md-0">
                <div class="info-icon me-2">
                    <i class="fas fa-thermometer-half fa-2x text-warning"></i>
                </div>
                <div class="info-text">
                    <div class="small">Temperature</div>
                    <div class="fw-bold">28°C</div>
                </div>
            </div>

            <!-- Humidity -->
            <div class="info-item d-flex align-items-center mb-2 mb-md-0">
                <div class="info-icon me-2">
                    <i class="fas fa-tint fa-2x text-warning"></i>
                </div>
                <div class="info-text">
                    <div class="small">Humidity</div>
                    <div class="fw-bold">65%</div>
                </div>
            </div>

            <!-- Rainfall -->
            <div class="info-item d-flex align-items-center mb-2 mb-md-0">
                <div class="info-icon me-2">
                    <i class="fas fa-cloud-showers-heavy fa-2x text-warning"></i>
                </div>
                <div class="info-text">
                    <div class="small">Rainfall</div>
                    <div class="fw-bold">12mm</div>
                </div>
            </div>

            <!-- Wind Speed -->
            <div class="info-item d-flex align-items-center mb-2 mb-md-0">
                <div class="info-icon me-2">
                    <i class="fas fa-wind fa-2x text-warning"></i>
                </div>
                <div class="info-text">
                    <div class="small">Wind Speed</div>
                    <div class="fw-bold">8 km/h</div>
                </div>
            </div>

        </div>
    </div>
</div>
