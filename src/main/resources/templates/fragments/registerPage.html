<!-- registerPage.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgriConnect Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #2D5016;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            animation: floatIn 1s ease-in-out;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
        }

        @keyframes floatIn {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .btn-agri {
            background-color: #2e7d32;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-agri:hover {
            background-color: #256427;
            transform: scale(1.02);
        }

        .btn-back {
            background-color: #f57c00;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #d96800;
            transform: scale(1.02);
        }

        .language-select {
            max-width: 150px;
        }
    </style>
</head>
<body>

<div class="card register-card animate__animated animate__fadeInUp">

    <!-- Title -->
    <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill fs-1 text-success"></i>
        <h3 class="fw-bold mt-2" style="color: #2e7d32;">AgriConnect Register</h3>
        <p class="text-muted">Join us and grow with AgriConnect 🌱</p>
    </div>

    <!-- Error Message at Top -->
    <div th:if="${registerError}" class="alert alert-danger shadow-sm animate__animated animate__shakeX mb-3"
         th:text="${registerError}"></div>

    <!-- Registration Form -->
    <form th:action="@{/doRegister}" th:object="${registerRequest}" th:method="post" class="needs-validation" novalidate>

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label fw-semibold" for="username">
                <i class="bi bi-person-fill me-2 text-success"></i>Username
            </label>
            <input type="text" class="form-control shadow-sm" id="username" th:field="*{username}"
                   placeholder="अपना उपयोगकर्ता नाम चुनें" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label fw-semibold" for="email">
                <i class="bi bi-envelope-fill me-2 text-success"></i>Email
            </label>
            <input type="email" class="form-control shadow-sm" id="email" th:field="*{email}"
                   placeholder="अपना ईमेल दर्ज करें" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label fw-semibold" for="password">
                <i class="bi bi-lock-fill me-2 text-success"></i>Password
            </label>
            <input type="password" class="form-control shadow-sm" id="password" th:field="*{password}"
                   placeholder="एक पासवर्ड बनाएं" required>
        </div>

        <!-- Language Selector -->
        <div class="mb-3">
            <label class="form-label fw-semibold" for="language">
                <i class="bi bi-translate me-2 text-success"></i>Language
            </label>
            <select class="form-select language-select" id="language" th:field="*{language}" required>
                <option value="" disabled>Select Language</option>
                <option value="en" selected>English</option>
                <option value="hi">Hindi</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese</option>
            </select>
        </div>

        <!-- Service Provider Radios -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                <i class="bi bi-briefcase-fill me-2 text-success"></i>Are you a service provider?
            </label>
            <div class="form-check">
                <input class="form-check-input" type="radio" th:field="*{serviceProvider}" id="serviceYes" value="Yes" required>
                <label class="form-check-label" for="serviceYes">Yes</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" th:field="*{serviceProvider}" id="serviceNo" value="No" required>
                <label class="form-check-label" for="serviceNo">No</label>
            </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-agri w-100 shadow-sm">
                <i class="bi bi-person-check-fill me-2"></i> Register
            </button>
            <a th:href="@{/farmerTemplate}" class="btn btn-back w-100 shadow-sm">
                <i class="bi bi-arrow-left-circle me-2"></i> Back
            </a>
        </div>

        <!-- Login Link -->
        <p class="mt-3 text-center">
            Already have an account?
            <a th:href="@{/loginPage}" class="fw-semibold" style="color: #f57c00;">Login here</a>
        </p>
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('language').addEventListener('change', function() {
        console.log('Language selected: ' + this.value);
    });
</script>

</body>
</html>
