<!-- fragments/mainNav.html -->
<!-- Leaf-Themed Navigation Bar Fragment -->
<nav th:fragment="main-nav-fragment" xmlns:th="http://www.thymeleaf.org">
    <div class="leaf-nav-container bg-success bg-opacity-10">
        <div class="leaf-nav">
            <a th:href="@{/farmerTemplate}" class="leaf-nav-item active">
                <i class="fas fa-cloud-sun"></i> Dashboard
            </a>
            <a th:href="@{/WeatherTemplate}" class="leaf-nav-item">
                <i class="fas fa-cloud-sun"></i> Weather & Climate
            </a>
            <a th:href="@{/Croprecommendation}" class="leaf-nav-item">
                <i class="fas fa-robot"></i> AI Crop Recommendation
            </a>
            <a th:href="@{/knowledgehub}" class="leaf-nav-item">
                <i class="fas fa-book"></i> Knowledge Hub
            </a>
            <a th:href="@{/LabourAndTools}" class="leaf-nav-item">
                <i class="fas fa-tools"></i> Labour & Tools
            </a>
            <a th:href="@{/MarketPlace}" class="leaf-nav-item">
                <i class="fas fa-shopping-cart"></i> Marketplace
            </a>
            <a th:href="@{/StorageAndProcessing}" class="leaf-nav-item">
                <i class="fas fa-warehouse"></i> Storage & Processing
            </a>
            <a th:href="@{/GovernmentScheme}" class="leaf-nav-item">
                <i class="fas fa-seedling"></i> Government Schemes
            </a>
            <a th:href="@{/Chat}" class="leaf-nav-item">
                <i class="fas fa-seedling"></i> Virtual Assistant
            </a>
            <a th:href="@{/LoanAssistent}" class="leaf-nav-item">
                <i class="fas fa-seedling"></i> Loan Assistant
            </a>
        </div>
    </div>

    <style>
        /* Leaf nav styles */
        .leaf-nav-container {
            margin: 0px 0 40px;
        }

        .leaf-nav {
            display: flex;
            overflow-x: auto;
            padding: 15px 5px;
            scroll-behavior: smooth;
        }

        .leaf-nav::-webkit-scrollbar {
            height: 6px;
        }

        .leaf-nav::-webkit-scrollbar-track {
            background: #1B2D12;
            border-radius: 10px;
        }

        .leaf-nav::-webkit-scrollbar-thumb {
            background: #4A7C3A;
            border-radius: 10px;
        }

        .leaf-nav-item {
            flex: 0 0 auto;
            background: linear-gradient(to bottom, #2D5016, #1B2D12);
            color: white;
            padding: 12px 25px;
            margin: 0 8px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #3A612D;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            white-space: nowrap;
            cursor: pointer;
        }

        .leaf-nav-item i {
            margin-right: 8px;
            color: #FFA62B;
        }

        .leaf-nav-item:hover {
            background: linear-gradient(to bottom, #4A7C3A, #2D5016);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .leaf-nav-item.active {
            background: linear-gradient(to right, #FFA62B, #FF9A02);
            color: #1B2D12;
            font-weight: 600;
        }

        .leaf-nav-item.active i {
            color: #1B2D12;
        }

        .nav-controls {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .nav-btn {
            background: #2D5016;
            border: 1px solid #3A612D;
            color: #FFA62B;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #4A7C3A;
            transform: scale(1.1);
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const leafNav = document.querySelector('.leaf-nav');
            const navItems = document.querySelectorAll('.leaf-nav-item');
            const currentPath = window.location.pathname;

            // Restore scroll position after page reload
            const savedScroll = sessionStorage.getItem("leafNavScroll");
            if (savedScroll) {
                leafNav.scrollLeft = parseInt(savedScroll, 10);
            }

            // Save scroll position and handle active highlight on click
            navItems.forEach(item => {
                item.addEventListener('click', function () {
                    // Save current scroll position
                    sessionStorage.setItem("leafNavScroll", leafNav.scrollLeft);

                    // Highlight clicked item
                    navItems.forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                });
            });

            // Highlight active based on current page path
            navItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('href') === currentPath) {
                    item.classList.add('active');
                }
            });
        });
    </script>
</nav>
