<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AgriConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/languageBar :: language-bar-fragment}"></div>

<!-- Wrapping fragments with th:block for clean Thymeleaf syntax -->
<th:block th:replace="~{fragments/mainNav :: main-nav-fragment}"></th:block>

<div th:replace="~{fragmentChat/chat :: virtual-assistant-page}"></div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>


<th:block th:replace="~{fragments/chatbot :: chatbot-fragment}"></th:block>

<script>
    function toggleChatbot() {
        const chatbot = document.querySelector('.chatbot-popup');
        if (chatbot.style.display === 'none' || chatbot.style.display === '') {
            chatbot.style.display = 'block';
        } else {
            chatbot.style.display = 'none';
        }
    }

    // Add basic chat functionality
    document.addEventListener('DOMContentLoaded', function() {
        const input = document.querySelector('.chatbot-input input');
        const button = document.querySelector('.chatbot-input button');
        const messagesContainer = document.querySelector('.chatbot-messages');

        button.addEventListener('click', sendMessage);
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const message = input.value.trim();
            if (message) {
                // Add user message
                const userMessage = document.createElement('div');
                userMessage.className = 'message user-message bg-success text-white p-3 mb-2 rounded ms-auto';
                userMessage.style.maxWidth = '80%';
                userMessage.style.borderBottomRightRadius = '5px !important';
                userMessage.textContent = message;
                messagesContainer.appendChild(userMessage);

                // Clear input
                input.value = '';

                // Scroll to bottom
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // Simulate bot response after a short delay
                setTimeout(() => {
                    const botMessage = document.createElement('div');
                    botMessage.className = 'message bot-message bg-light p-3 mb-2 rounded';
                    botMessage.style.maxWidth = '80%';
                    botMessage.style.borderBottomLeftRadius = '5px !important';
                    botMessage.textContent = "Thanks for your message. I'll help you with that shortly.";
                    messagesContainer.appendChild(botMessage);

                    // Scroll to bottom again
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 1000);
            }
        }
    });
</script>
</body>
</html>
