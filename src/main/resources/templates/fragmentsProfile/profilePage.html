<!-- templates/fragments/profileFragment.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Profile Fragment -->
<div th:fragment="profile-fragment">

    <div class="container py-5">
        <div class="card shadow p-4">

            <!-- View Mode -->
            <div th:if="${mode == 'view'}">
                <div class="text-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                         class="rounded-circle mb-3" width="120" height="120" alt="Profile Icon">
                    <h3 th:text="${user.username}">User Name</h3>
                </div>
                <hr>
                <p><strong>Email:</strong> <span th:text="${user.email}">email@example.com</span></p>
                <p><strong>Service Provide:</strong> <span th:text="${user.serviceProvider}">Yes</span></p>
                <p><strong>Language:</strong> <span th:text="${user.language}">Hindi</span></p>
                <div class="mt-3">
                    <a th:href="@{/profile/edit}" class="btn btn-primary">Edit Profile</a>
                </div>
            </div>

            <!-- Edit Mode -->
            <div th:if="${mode == 'edit'}">
                <h3 class="mb-3">Edit Profile</h3>
                <form th:action="@{/profile/update}" th:object="${editModel}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Service Provide</label>
                        <select th:field="*{serviceProvider}" class="form-control" required>
                            <option th:value="'Yes'" th:selected="*{serviceProvider} == 'Yes'">Yes</option>
                            <option th:value="'No'" th:selected="*{serviceProvider} == 'No'">No</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Language</label>
                        <input type="text" th:field="*{language}" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">Update</button>
                    <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>

        </div>
    </div>

</div>

</body>
</html>
