<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <div th:fragment="government-scheme">
        <!-- Hero Section -->
        <section class="c1 py-5" style="background-color: #2D5016;">
            <div class="container">
                <div class="text-center py-4">
                    <h1 class="c1 fw-bold mb-3">Government Schemes for Farmers</h1>
                    <p class="c1 lead mx-auto" style="max-width: 800px;">
                        Discover and apply for various government initiatives designed to support and empower farmers across India.
                        Find subsidies, financial assistance, and development programs tailored to your needs.
                    </p>
                </div>
            </div>
        </section>

        <!-- Scheme Filter -->
        <section class="py-4">
            <div class="container">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-semibold mb-4" style="color: var(--primary);">Find Schemes That Match Your Needs</h5>
                        <form th:action="@{/government-schemes}" method="get">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label for="scheme-type" class="form-label fw-medium" style="color: var(--text-medium);">Scheme Type</label>
                                    <select class="form-select" id="scheme-type" name="schemeType">
                                        <option value="">All Types</option>
                                        <option th:each="type : ${schemeTypes}"
                                                th:value="${type.value}"
                                                th:text="${type.label}"
                                                th:selected="${selectedSchemeType == type.value}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="state" class="form-label fw-medium" style="color: var(--text-medium);">State</label>
                                    <select class="form-select" id="state" name="state">
                                        <option value="">All States</option>
                                        <option th:each="state : ${states}"
                                                th:value="${state.value}"
                                                th:text="${state.label}"
                                                th:selected="${selectedState == state.value}">
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="category" class="form-label fw-medium" style="color: var(--text-medium);">Farmer Category</label>
                                    <select class="form-select" id="category" name="category">
                                        <option value="">All Categories</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.value}"
                                                th:text="${category.label}"
                                                th:selected="${selectedCategory == category.value}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn-agri-primary">Apply Filters</button>
                                <a th:href="@{/government-schemes}" class="btn-agri-outline">Reset Filters</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
