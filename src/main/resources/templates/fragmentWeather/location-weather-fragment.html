<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Fragment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        /* Horizontal scroll container */
        .hourly-forecast {
            display: flex;
            flex-wrap: nowrap;
            gap: 12px;
            overflow-x: auto;
            padding: 8px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .hourly-forecast::-webkit-scrollbar { height: 6px; }
        .hourly-forecast::-webkit-scrollbar-thumb { background-color: #2D5016; border-radius: 3px; }
        .hourly-forecast::-webkit-scrollbar-track { background-color: #e9ecef; border-radius: 3px; }

        /* Hourly card styled like 5-day forecast */
        .hourly-card {
            flex: 0 0 auto;
            width: 80px;
            border-radius: 10px;
            background: #fff;
            text-align: center;
            padding: 8px 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .hourly-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .hourly-card h6 { font-size: 0.75rem; margin-bottom: 4px; color: #198754; }
        .hourly-card p { font-size: 0.7rem; margin: 0; color: #495057; }

        /* 5-Day Forecast Cards */
        .forecast-card {
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            margin-bottom: 8px;
            background: #fff;
        }
        .forecast-card h6 { font-size: 0.8rem; margin-bottom: 4px; color: #198754; }
        .forecast-card p { font-size: 0.75rem; margin: 0; color: #495057; }

        @media (max-width: 576px) { .hourly-card { width: 70px; } }
    </style>
</head>
<body>
<div th:fragment="location-weather-fragment">

    <div class="container my-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header text-center">🌍 Get Location-Specific Weather Data</div>
            <div class="card-body">
                <!-- Form -->
                <form id="locationWeatherForm" class="mb-3">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">State</label>
                            <select class="form-select" id="stateSelect" required>
                                <option value="" selected disabled>Loading states...</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">City/District</label>
                            <select class="form-select" id="citySelect" required disabled>
                                <option value="" selected disabled>Select City</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Village (Optional)</label>
                            <input type="text" class="form-control" id="villageInput" placeholder="Enter village name">
                        </div>
                    </div>
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button type="submit" class="btn text-white px-4" style="background-color: #2D5016;">☁️ Get Weather Data</button>
                        <button type="button" id="clearWeather" class="btn btn-outline-danger px-3">🧹 Clear</button>
                    </div>
                </form>

                <!-- Loading -->
                <div class="text-center my-3" id="weatherLoading" style="display: none;">
                    <div class="spinner-border text-success"></div>
                    <p class="mt-2 mb-0">Fetching weather data...</p>
                </div>

                <!-- Results -->
                <div id="weatherResult" style="display: none;">
                    <div class="card border rounded">
                        <div class="card-body">
                            <h5 class="card-title text-center">Weather for <span id="locationName"></span></h5>
                            <p class="text-center mb-2">🌤️ <span id="currentTemp">28°C</span> <small id="currentDesc">--</small></p>
                            <ul class="list-group list-group-flush mb-3">
                                <li class="list-group-item d-flex justify-content-between"><span>🌬️ Wind</span><span id="windVal">--</span></li>
                                <li class="list-group-item d-flex justify-content-between"><span>💧 Humidity</span><span id="humVal">--</span></li>
                                <li class="list-group-item d-flex justify-content-between"><span>⏱ Pressure</span><span id="pressVal">--</span></li>
                            </ul>

                            <!-- Hourly Forecast -->
                            <div class="mb-3">
                                <h6 class="text-primary text-center">Today's Hourly Forecast</h6>
                                <div class="hourly-forecast" id="hourlyContainer"></div>
                            </div>

                            <!-- 5-Day Forecast -->
                            <div>
                                <h6 class="text-success text-center">5-Day Forecast</h6>
                                <div class="row text-center" id="forecastContainer"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script fragment -->
<script th:fragment="location-weather-script" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', async function () {
        const stateSelect = document.getElementById('stateSelect');
        const citySelect = document.getElementById('citySelect');
        const villageInput = document.getElementById('villageInput');
        const form = document.getElementById('locationWeatherForm');
        const loading = document.getElementById('weatherLoading');
        const resultsDiv = document.getElementById('weatherResult');
        const locationName = document.getElementById('locationName');
        const clearBtn = document.getElementById('clearWeather');
        const forecastContainer = document.getElementById('forecastContainer');
        const hourlyContainer = document.getElementById('hourlyContainer');

        let statesData = [];

        try {
            const res = await fetch('/api/states');
            statesData = await res.json();
            stateSelect.innerHTML = '<option value="" disabled selected>Select State</option>';
            statesData.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.name;
                opt.textContent = s.name;
                stateSelect.appendChild(opt);
            });
        } catch (err) {
            console.error("Failed to load states.json", err);
            stateSelect.innerHTML = '<option value="" disabled>Error loading states</option>';
        }

        stateSelect.addEventListener('change', function () {
            const selectedState = this.value;
            citySelect.disabled = false;
            citySelect.innerHTML = '<option value="" disabled selected>Select City</option>';
            const stateObj = statesData.find(s => s.name === selectedState);
            if (stateObj) {
                stateObj.cities.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    citySelect.appendChild(opt);
                });
            }
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const stateText = stateSelect.value;
            const cityText = citySelect.value;
            const village = villageInput.value.trim();

            if (!stateText || !cityText) {
                alert("Please select State and City");
                return;
            }

            loading.style.display = 'block';
            resultsDiv.style.display = 'none';

            const params = new URLSearchParams({ state: stateText, city: cityText, village });
            fetch(`/api/weather?${params.toString()}`)
                .then(res => res.json())
                .then(data => {
                    loading.style.display = 'none';
                    resultsDiv.style.display = 'block';
                    locationName.textContent = village ? `${village}, ${cityText}, ${stateText}` : `${cityText}, ${stateText}`;

                    if (data.current) {
                        document.getElementById('currentTemp').textContent = `${data.current.main.temp.toFixed(1)}°C`;
                        document.getElementById('currentDesc').textContent = data.current.weather[0].description;
                        document.getElementById('windVal').textContent = `${data.current.wind.speed} km/h`;
                        document.getElementById('humVal').textContent = `${data.current.main.humidity}%`;
                        document.getElementById('pressVal').textContent = `${data.current.main.pressure} hPa`;
                    }

                    // Hourly Forecast (Styled like cards)
                    hourlyContainer.innerHTML = '';
                    data.forecast.list.slice(0, 8).forEach(entry => {
                        const date = new Date(entry.dt * 1000);
                        const card = document.createElement('div');
                        card.className = 'hourly-card';
                        card.innerHTML = `
                            <h6>${date.getHours()}:00</h6>
                            <p>🌡️ ${entry.main.temp.toFixed(1)}°C</p>
                            <p>${entry.weather[0].description}</p>`;
                        hourlyContainer.appendChild(card);
                    });

                    // 5-Day Forecast
                    const dailyMap = {};
                    data.forecast.list.forEach(entry => {
                        const day = new Date(entry.dt * 1000).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
                        if (!dailyMap[day]) dailyMap[day] = [];
                        dailyMap[day].push(entry);
                    });

                    forecastContainer.innerHTML = '';
                    Object.keys(dailyMap).slice(0,5).forEach(day => {
                        const temps = dailyMap[day].map(e => e.main.temp);
                        const min = Math.min(...temps).toFixed(1);
                        const max = Math.max(...temps).toFixed(1);
                        const card = document.createElement('div');
                        card.className = 'col forecast-card card shadow-sm m-1 p-2';
                        card.innerHTML = `
                            <h6>${day}</h6>
                            <p>🌡️ ${min}°C - ${max}°C</p>
                            <p>${dailyMap[day][0].weather[0].description}</p>`;
                        forecastContainer.appendChild(card);
                    });
                })
                .catch(err => {
                    console.error(err);
                    loading.style.display = 'none';
                    alert("❌ Failed to fetch weather. Check API key or inputs.");
                });
        });

        clearBtn.addEventListener('click', function () {
            form.reset();
            citySelect.disabled = true;
            resultsDiv.style.display = 'none';
            loading.style.display = 'none';
            hourlyContainer.innerHTML = '';
            forecastContainer.innerHTML = '';
            locationName.textContent = '';
        });
    });
</script>
</body>
</html>
