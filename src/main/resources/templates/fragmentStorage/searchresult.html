<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<!--title and buy fragment-->
<div th:fragment="search-result">
    <div>
        <!-- Results Section -->
        <div th:if="${facilities != null and facilities.empty}">
            <div class="no-results">
                <i class="fas fa-search fa-3x text-muted mb-3"></i>
                <h4 class="text-muted">No facilities found</h4>
                <p class="text-muted">Try adjusting your filters to find more results</p>
            </div>
        </div>

        <div th:unless="${facilities != null and facilities.empty}" class="row">
            <div class="col-12 mb-4">
                <h4 class="text-success"><i class="fas fa-check-circle me-2"></i>
                    <span >Found facilities</span>
                </h4>
            </div>

            <div th:each="facility : ${facilities}" class="col-lg-4 col-md-6">
                <div class="facility-card">
                    <div class="position-relative">
                        <img th:src="${facility.imageUrl}" class="facility-image" alt="Facility image">
                        <span class="facility-type-badge badge"
                              th:classappend="${facility.type == 'Cold Storage'} ? 'bg-info' : 'bg-warning text-dark'"
                              th:text="${facility.type}">
                            Facility Type
                        </span>
                        <span class="space-availability badge"
                              th:classappend="${facility.availability == 'Available'} ? 'bg-success' :
                                              ${facility.availability == 'Limited'} ? 'bg-warning text-dark' : 'bg-danger'">
                            <i class="fas fa-box me-1"></i>
                            <span th:text="${facility.availability == 'Available'} ? 'Space Available' :
                                          ${facility.availability == 'Limited'} ? 'Limited Space' : 'Almost Full'">
                                Space Status
                            </span>
                        </span>
                    </div>
                    <div class="facility-details">
                        <h5 class="facility-name" th:text="${facility.name}">Facility Name</h5>
                        <p class="card-text text-muted" th:text="${facility.description}">Facility description goes here.</p>

                        <div class="facility-info mb-3">
                            <div class="d-flex align-items-center mb-1">
                                <i class="fas fa-map-marker-alt text-muted me-2"></i>
                                <small th:text="${facility.address}">Facility Address</small>
                            </div>
                            <div class="d-flex align-items-center mb-1">
                                <i class="fas fa-phone text-muted me-2"></i>
                                <small th:text="${facility.phone}">Phone Number</small>
                            </div>
                            <div class="d-flex align-items-center mb-1" th:if="${facility.distance}">
                                <i class="fas fa-road text-muted me-2"></i>
                                <small th:text="${facility.distance + ' km away'}">Distance away</small>
                            </div>
                            <div class="d-flex align-items-center mb-1">
                                <i class="fas fa-rupee-sign text-muted me-2"></i>
                                <small th:text="'₹' + ${facility.price} + '/day per ' + ${facility.unit}">Pricing info</small>
                            </div>
                        </div>

                        <div class="facility-features">
                            <span class="feature-badge" th:each="feature : ${facility.features}" th:text="${feature}">Feature</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-3 btn-group-responsive">
                            <a th:href="@{'tel:' + ${facility.phone}}" class="contact-btn btn">
                                <i class="fas fa-phone me-1"></i> Contact
                            </a>
                            <button class="booking-btn btn" data-bs-toggle="modal" data-bs-target="#bookingModal"
                                    th:onclick="|prepareBooking('${facility.name}', '${facility.type}', '${facility.id}')|">
                                <i class="fas fa-calendar-check me-1"></i> Book Now
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
