<!-- Recommendation Form Fragment -->
<div th:fragment="recommendation-form" xmlns:th="http://www.w3.org/1999/xhtml" class="container">
    <div class="recommendation-form">
        <h2 class="mb-4 text-center">Tell Us About Your Farm</h2>
        <form id="cropRecommendationForm" th:action="@{/recommend}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="soilType" class="form-label">Soil Type</label>
                    <select class="form-select" id="soilType" name="soilType" required>
                        <option value="" selected disabled>Select soil type</option>
                        <option value="sandy">Sandy</option>
                        <option value="loamy">Loamy</option>
                        <option value="clay">Clay</option>
                        <option value="silt">Silt</option>
                        <option value="peat">Peat</option>
                        <option value="chalky">Chalky</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="phLevel" class="form-label">Soil pH Level</label>
                    <input type="range" class="form-range" id="phLevel" name="phLevel" min="4" max="9" step="0.1" th:value="6.5" oninput="phOutput.value = phLevel.value">
                    <div class="d-flex justify-content-between">
                        <small>Acidic (4.0)</small>
                        <output id="phOutput">6.5</output>
                        <small>Alkaline (9.0)</small>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="rainfall" class="form-label">Annual Rainfall (mm)</label>
                    <input type="number" class="form-control" id="rainfall" name="rainfall" placeholder="Enter rainfall in mm" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="temperature" class="form-label">Average Temperature (°C)</label>
                    <input type="number" class="form-control" id="temperature" name="temperature" placeholder="Enter temperature in °C" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="region" class="form-label">Region/State</label>
                    <select class="form-select" id="region" name="region" required>
                        <option value="" selected disabled>Select your region</option>
                        <option value="north">Northern India</option>
                        <option value="south">Southern India</option>
                        <option value="east">Eastern India</option>
                        <option value="west">Western India</option>
                        <option value="central">Central India</option>
                        <option value="northeast">Northeast India</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="season" class="form-label">Planting Season</label>
                    <select class="form-select" id="season" name="season" required>
                        <option value="" selected disabled>Select planting season</option>
                        <option value="kharif">Kharif (Monsoon)</option>
                        <option value="rabi">Rabi (Winter)</option>
                        <option value="zaid">Zaid (Summer)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="farmSize" class="form-label">Farm Size (acres)</label>
                    <input type="number" class="form-control" id="farmSize" name="farmSize" placeholder="Enter farm size in acres" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="waterSource" class="form-label">Water Source</label>
                    <select class="form-select" id="waterSource" name="waterSource" required>
                        <option value="" selected disabled>Select water source</option>
                        <option value="rainfed">Rainfed</option>
                        <option value="canal">Canal Irrigation</option>
                        <option value="well">Well/Tube-well</option>
                        <option value="river">River</option>
                    </select>
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="fas fa-search me-2"></i> Get Recommendations
                </button>
            </div>
        </form>
    </div>
</div>
