<!-- Result Section Fragment -->
<div th:fragment="result-section" xmlns:th="http://www.w3.org/1999/xhtml" class="container">
    <div class="result-section">
        <h2 class="mb-4 text-center">Recommended Crops</h2>
        <p class="text-center text-muted mb-4">Based on your inputs, here are the best crops for your farm</p>

        <div class="row">
            <div class="col-md-4" th:each="crop : ${recommendedCrops}">
                <div class="crop-card">
                    <img th:src="${crop.imageUrl}" alt="Crop image" class="crop-image w-100 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h4 th:text="${crop.name}">Crop Name</h4>
                        <span class="badge bg-success" th:text="${crop.suitability}">Highly Suitable</span>
                    </div>
                    <p class="text-muted" th:text="${crop.description}">Crop description goes here.</p>
                    <div class="row text-center mt-3">
                        <div class="col-4">
                            <small class="text-muted">Season</small>
                            <div class="fw-medium" th:text="${crop.season}">Rabi</div>
                        </div>
                        <div class="col-4">
                            <small class="text-muted">Water Needs</small>
                            <div class="fw-medium" th:text="${crop.waterNeeds}">Moderate</div>
                        </div>
                        <div class="col-4">
                            <small class="text-muted">Profit Potential</small>
                            <div class="fw-medium" th:text="${crop.profitPotential}">High</div>
                        </div>
                    </div>
                    <button class="btn btn-outline-success w-100 mt-3">
                        <i class="fas fa-info-circle me-2"></i> View Details
                    </button>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-outline-success me-2" onclick="window.print()">
                <i class="fas fa-print me-2"></i> Print Recommendations
            </button>
            <a th:href="@{/Croprecommendation}" class="btn btn-success">
                <i class="fas fa-redo me-2"></i> Start New Recommendation
            </a>
        </div>
    </div>
</div>
