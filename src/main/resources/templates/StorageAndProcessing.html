<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AgriConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/storage-style.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/languageBar :: language-bar-fragment}"></div>

<!-- Wrapping fragments with th:block for clean Thymeleaf syntax -->
<th:block th:replace="~{fragments/mainNav :: main-nav-fragment}"></th:block>

<th:block th:replace="~{fragmentStorage/search :: search-facility}"></th:block>

<th:block th:replace="~{fragmentStorage/searchresult :: search-result}"></th:block>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/chatbot :: chatbot-fragment}"></th:block>


<!-- Bootstrap JS and Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>
    // Simple state-city relationship for demo
    document.addEventListener('DOMContentLoaded', function() {
        const stateSelect = document.getElementById('state');
        const citySelect = document.getElementById('city');

        if (stateSelect) {
            stateSelect.addEventListener('change', function() {
                // Enable city selection when state is selected
                citySelect.disabled = !this.value;
            });
        }
    });

    // Prepare booking modal with facility details
    function prepareBooking(name, type, id) {
        document.getElementById('facilityName').value = name;
        document.getElementById('facilityType').value = type;
        document.getElementById('facilityId').value = id;
    }
</script>

</body>
</html>
