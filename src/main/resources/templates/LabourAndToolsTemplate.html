<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AgriConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/languageBar :: language-bar-fragment}"></div>

<!-- Wrapping fragments with th:block for clean Thymeleaf syntax -->
<th:block th:replace="~{fragments/mainNav :: main-nav-fragment}"></th:block>

<th:block th:replace="~{fragmentlabour/labour-tools-fragments :: labour-tools-fragments}"></th:block>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<th:block th:replace="~{fragments/chatbot :: chatbot-fragment}"></th:block>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Language selection
        const languageOptions = document.querySelectorAll('.language-option');
        languageOptions.forEach(option => {
            option.addEventListener('click', () => {
                languageOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
            });
        });


        // Chatbot functionality
        const chatbotIcon = document.querySelector('.chatbot-icon');
        const chatbotPopup = document.querySelector('.chatbot-popup');
        const chatbotClose = document.querySelector('.chatbot-close');
        const chatbotInput = document.querySelector('.chatbot-input input');
        const chatbotSend = document.querySelector('.chatbot-input button');
        const chatbotMessages = document.querySelector('.chatbot-messages');

        if (chatbotIcon && chatbotPopup) {
            chatbotIcon.addEventListener('click', () => {
                chatbotPopup.style.display = 'flex';
            });

            chatbotClose.addEventListener('click', () => {
                chatbotPopup.style.display = 'none';
            });

            function addMessage(text, isUser) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(isUser ? 'user-message' : 'bot-message');
                messageDiv.textContent = text;
                chatbotMessages.appendChild(messageDiv);
                chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
            }

            if (chatbotSend && chatbotInput) {
                chatbotSend.addEventListener('click', () => {
                    if (chatbotInput.value.trim() !== '') {
                        addMessage(chatbotInput.value, true);

                        // Simulate bot response
                        setTimeout(() => {
                            addMessage("Thank you for your message. Our team will get back to you soon with more information.", false);
                        }, 1000);

                        chatbotInput.value = '';
                    }
                });

                chatbotInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        chatbotSend.click();
                    }
                });
            }
        }
    });
</script>
</body>
</html>
