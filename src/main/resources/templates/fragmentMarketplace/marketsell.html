<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<!-- Sell Form Section fragment -->
<div th:fragment="marketplace-sell">
    <!-- Sell Form Section -->
    <section class="sell-form-section">
        <div class="container">
            <h2 class="text-center mb-5">Sell Your Products</h2>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="form-card">
                        <form th:action="@{/marketplace/products}" th:object="${product}" method="post" enctype="multipart/form-data">
                            <h4 class="mb-4">List Your Agricultural Products</h4>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Product Name</label>
                                    <input type="text" class="form-control"  placeholder="Enter product name">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Category</label>
                                    <select class="form-select" >
                                        <option value="">Select Category</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="${category.name}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">Price ($)</label>
                                    <input type="number" class="form-control" placeholder="Enter price">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Quantity</label>
                                    <input type="number" class="form-control">
                                </div> <!-- ✅ Fixed missing closing div -->
                                <div class="col-md-3">
                                    <label class="form-label">Unit</label>
                                    <select class="form-select">
                                        <option value="">Select Unit</option>
                                        <option value="kg">Kilogram (kg)</option>
                                        <option value="quintal">Quintal</option>
                                        <option value="bag">Bag</option>
                                        <option value="piece">Piece</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Location</label>
                                    <select class="form-select">
                                        <option value="">Select Location</option>
                                        <option th:each="region : ${regions}"
                                                th:value="${region.id}"
                                                th:text="${region.name}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Product Description</label>
                                <textarea class="form-control" rows="4" placeholder="Describe your product in detail. Include details about quality, certification, harvesting date, etc."></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Product Images</label>
                                <input type="file" class="form-control" multiple accept="image/*"> <!-- ✅ Fixed accept -->
                                <div class="form-text">Upload clear images of your product from different angles (max 5 images)</div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">List Product</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
