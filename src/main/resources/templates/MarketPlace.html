<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AgriConnect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/marketplace-style.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/languageBar :: language-bar-fragment}"></div>

<!-- Wrapping fragments with th:block for clean Thymeleaf syntax -->
<th:block th:replace="~{fragments/mainNav :: main-nav-fragment}"></th:block>

<th:block th:replace="~{fragmentMarketplace/marketbuy :: marketplace-buy}"></th:block>

<th:block th:replace="~{fragmentMarketplace/marketsell :: marketplace-sell}"></th:block>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<th:block th:replace="~{fragments/chatbot :: chatbot-fragment}"></th:block>


<!-- Bootstrap JS and Popper.js -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>
    // Navigation functionality
    const navItems = document.querySelectorAll('.leaf-nav-item');
    navItems.forEach(item => {
        item.addEventListener('click', function() {
            navItems.forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Language selection functionality
    const languageOptions = document.querySelectorAll('.language-option');
    languageOptions.forEach(option => {
        option.addEventListener('click', function() {
            languageOptions.forEach(opt => opt.classList.remove('active'));
            this.classList.add('active');
            // Here you would typically implement language change logic
        });
    });


</script>

</body>
</html>
